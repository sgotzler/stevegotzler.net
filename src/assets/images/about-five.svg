<svg xmlns="http://www.w3.org/2000/svg" role="group" aria-labelledby="about-mark-title-5" viewBox="0 0 192 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
