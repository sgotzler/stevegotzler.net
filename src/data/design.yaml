# Games. Copy adapted from the CV entries (Oct 2026). Both are creative practice, not research outputs.
- id: skydiving-rpg
  order: 1
  title: "*Skydiver’s Information Manual, 1992*"
  years: "2026"
  status: Prototype
  description: "A found-object solo role-playing game, composed out of the United States Parachute Association’s handbook for new jumpers, a manual of rules for managing a dangerous form of play."
  grounding: "W. J. Miller and J. H. Frey, “Skydivers as Risk Takers: An Examination”; a logbook kept by a skydiver in 1992; my childhood"
  slides: 4
  imageNote: spreads from the altered manual
  # Placeholder photos of the 1992 manual and logbook, until scans of the altered pages exist.
  gallery:
    - alt: "The page Parachute Nomenclature and Function, with drawings of piggyback and conventional rigs, three canopy types, and a labelled diagram of a square canopy"
    - alt: "Two handwritten logbook entries from late 1992; one records broken steering lines and a hard landing: Should have cut away!"
    - alt: "The manual's Warning and Disclaimer, which begins: Whenever a person leaves the ground, he or she risks injury and even death"
    - alt: "The back cover, a photograph of skydivers linked in formation, with the quotation: and once you have tasted flight, you will walk the earth with your eyes turned skyward"

- id: keep-calm-and-carry-on
  order: 2
  title: "*Keep Calm and Carry On*"
  years: 2025–
  status: In development
  description: A historical board game about the London Blitz, drawing on materials in the Imperial War Museum archives and designed as an operational war game, but without combatants.
  grounding: "Paul K. Saint-Amour, *Tense Future*; Angus Calder, *The Myth of the Blitz*; IWM London"
  slides: 3
  # One description per carousel image, in slide order.
  gallery:
    - alt: An Air Raid Precautions Warden's Report Form, photographed in an archive beside a grey scale card, with blank fields for the type of bombs, casualties, fire, and damage to mains
    - alt: A bomb damage map of the City of London around St Paul's Cathedral, with most of the surrounding blocks coloured purple for damaged beyond repair
    - alt: The words Keep Calm in white capitals on the creased red paper of the 1939 poster
