- id: multimodal-composition
  order: 1
  title: multimodal composition
  courses: ENGL 257 · ENGL 258
  slides: 2
  description: Critical work composed in the forms it studies, setting games beside film and poetry.
  imageNote: a still from each assignment
  assignments:
    - course: ENGL 257
      title: Cut Scenes
      line: Students capture and edit gameplay footage together with cinematic footage, composing essays that make visual arguments about the interpenetrated histories of games and cinema. Each essay is scripted, storyboarded, and edited in stages, building its argument shot by shot.
      linkLabel: Watch
    - course: ENGL 258
      courseNote: (now ENGL 168)
      title: "*Stardew* Poetry"
      line: Students cut-and-mix in-game text from *Stardew Valley* with pastoral poetry from Theocritus to Wordsworth, composing new eclogues. The remix format collapses close reading, procedural analysis, and creative writing into a single composition.
      linkLabel: Read

