# Show and link student work only with the students' consent.
# Carousel images: src/assets/images/<id>-1.jpg, <id>-2.jpg … one still per assignment, in row order.

- id: multimodal-composition
  order: 1
  title: Multimodal Composition
  courses: ENGL 257 · ENGL 258
  slides: 2
  description: Critical arguments composed from found material, in video and in verse, where the arrangement itself makes the case.
  imageNote: a still from each assignment
  assignments:
    - course: ENGL 257
      title: Video Essay
      line: Students capture and edit gameplay footage together with cinematic footage, composing essays that make visual arguments about the interpenetrated histories of games and cinema. Students script, storyboard, and edit in stages, so the argument is built shot by shot.
      linkLabel: Watch
    - course: ENGL 258
      courseNote: (now ENGL 168)
      title: "*Stardew* Poetry"
      line: Students cut-and-mix in-game dialogue and text from *Stardew Valley* with pastoral poetry from Theocritus to Wordsworth, composing new eclogues. The remix format collapses close reading, procedural analysis, and creative writing into a single composition.
      linkLabel: Read

