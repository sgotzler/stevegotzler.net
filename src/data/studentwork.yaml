# Student Work on the Pedagogy page. Two plates, each grouping signature assignments by kind;
# the assignments are listed inside the plate, one row each, with a link out to the work.
# Show and link student work only with the students' consent.
# Carousel images: src/assets/images/<id>-1.jpg, <id>-2.jpg … one still per assignment, in row order.

- id: multimodal-composition
  order: 1
  title: multimodal composition
  courses: ENGL 257 · ENGL 258
  slides: 2
  description: Critical work composed in the forms it studies, setting games beside film and poetry.
  imageNote: a still from each assignment
  assignments:
    - course: ENGL 257
      title: Cut Scenes
      line: Students capture and edit gameplay footage together with cinematic footage, composing essays that make visual arguments about the interpenetrated histories of games and cinema. Each essay is scripted, storyboarded, and edited in stages, building its argument shot by shot.
      linkLabel: Watch
    - course: ENGL 258
      courseNote: (now ENGL 168)
      title: "*Stardew* Poetry"
      line: Students cut-and-mix in-game text from *Stardew Valley* with pastoral poetry from Theocritus to Wordsworth, composing new eclogues. The remix format collapses close reading, procedural analysis, and creative writing into a single composition.
      linkLabel: Read

- id: game-design
  order: 2
  title: game design
  courses: ENGL 341 · ENGL 168
  slides: 2
  description: Design as a way of asking questions, and play as a way of testing the answers.
  imageNote: a still from each assignment
  assignments:
    - course: ENGL 341
      title: "*Monopoly*, but…"
      line: "In small groups, students rewrite the rules of *Monopoly* around a theme of their choosing. The work is practice in reading rules as interpretation: seeing how a theme lives in mechanics, and explaining design choices."
      linkLabel: Rules
    - course: ENGL 168
      title: RPG Design
      line: Students design short role-playing games inspired by the course’s readings, turning the conventions of fantasy, horror, or detective fiction into rules for play. Designing in a genre becomes a way of reading it closely, isolating formal techniques for worldbuilding, atmosphere, and investigation.
