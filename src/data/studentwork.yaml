- id: multimodal-composition
  order: 1
  title: Multimodal Composition
  courses: ENGL 257 · ENGL 258
  slides: 2
  description: Critical arguments composed from found material, in video and in verse, where the arrangement itself makes the case.
  imageNote: a still from each assignment
  assignments:
    - course: ENGL 257
      title: Video Essay
      line: A capstone video essay making an original argument about the shared histories, forms, and genres of games and cinema. Students move from proposal to storyboard and script, then edit through rough cut, peer review, and final cut. The visuals must argue as much as the voice-over.
      linkLabel: Watch
    - course: ENGL 258
      courseNote: (now ENGL 168)
      title: "*Stardew* Poetry"
      line: After a session on the pastoral and a critical play session in *Stardew Valley*, students compose a pastoral poem by cut-and-mix. Lines from Theocritus to Wordsworth meet the game’s dialogue and item text, with an author’s note on their choices. The remix itself carries the argument.
      linkLabel: Read

