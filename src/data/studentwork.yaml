# Student Work on the Pedagogy page. Two groups, each with a small heading and a framed set of
# assignments, one row each: an image, the course, the title, a description, and a link out to the work.
# Show and link student work only with the students' consent.
# Images: src/assets/images/<group id>-1.jpg, -2.jpg … one per assignment, in row order
#   (e.g. multimodal-composition-1.jpg is the Video Essays image). Until a file exists, a placeholder shows.
# `slides` is no longer used here.

- id: multimodal-composition
  order: 1
  title: multimodal composition
  courses: ENGL 257 · ENGL 258
  slides: 2
  imageNote: a still from each assignment
  gallery:
    - alt: ""
    - alt: "A Stardew Valley dialogue box reading: You're starting to feel exhausted."
  assignments:
    - course: ENGL 257
      title: Video Essays
      line: Students capture and edit gameplay footage together with cinematic footage, composing essays that make visual arguments about the interpenetrated histories of games and cinema. Each essay is scripted, storyboarded, and edited in stages, building its argument shot by shot.
      linkLabel: Watch
    - course: ENGL 258
      courseNote: (now ENGL 168)
      title: "*Stardew* Poetry"
      line: Students cut-and-mix in-game text from *Stardew Valley* with pastoral poetry from Theocritus to Wordsworth, composing new eclogues. The remix format collapses close reading, procedural analysis, and creative writing into a single composition.
      linkLabel: Read

- id: game-design
  order: 2
  title: game design
  courses: ENGL 168 · ENGL 341
  slides: 2
  imageNote: a still from each assignment
  gallery:
    - alt: "A character sheet from a student role-playing game about a band: The Hardcore, with a drawing of a bass player and a list of instruments to choose from"
    - alt: "A student redesign of Monopoly called Feudopoly, with decks labelled Banalities, Royal Reckoning and Divine Will on a re-skinned board"
  assignments:
    - course: ENGL 168
      title: Story Games
      line: Students design short role-playing games inspired by the course’s readings, turning the conventions of fantasy, horror, or detective fiction into rules for play. Designing in a genre becomes a way of reading it closely, isolating formal techniques for worldbuilding, atmosphere, and investigation.
    - course: ENGL 341
      title: "*Monopoly*, but…"
      line: "In small groups, students rewrite the rules of *Monopoly* around a theme of their choosing. Rewriting a game everyone knows turns its assumptions into choices that students can reverse, keep, or exaggerate."
      linkLabel: Rules
