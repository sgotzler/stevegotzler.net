<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carolina Seminar poster collage</title>
<!-- Source for the Carolina Seminar image on the Lab page. Screenshot at 1200 × 900.
     To change which posters show, edit the list of file names below. -->
<style>
  html, body { margin: 0; background: #0D0C0A; }
  /* Cells keep a poster's own shape, so nothing is cut off; the dark ground shows around them. */
  .grid { width: 1200px; height: 900px; display: grid; grid-template-columns: repeat(4, 280px); grid-auto-rows: 396px; gap: 16px; justify-content: center; align-content: center; background: #0D0C0A; }
  .grid img { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<div class="grid">
  <img src="p16-edmond-chang.webp" alt=""><img src="p03.png" alt=""><img src="p09.jpg" alt=""><img src="p06.png" alt="">
  <img src="p01.png" alt=""><img src="p15.jpg" alt=""><img src="p02.png" alt=""><img src="p05.png" alt="">
</div>
</body>
</html>
