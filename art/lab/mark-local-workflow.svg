<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 8 112 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- the local machine: everything happens inside this boundary -->
  <rect x="10" y="30" width="100" height="64" rx="2" stroke-dasharray="2 4" opacity=".6"/>

  <!-- 1: documents -->
  <rect x="26" y="46" width="16" height="22"/>
  <rect x="23" y="49" width="16" height="22" fill="var(--color-surface)"/>
  <rect x="20" y="52" width="16" height="22" fill="var(--color-surface)"/>
  <path d="M23.5 58h9M23.5 62h9M23.5 66h6" stroke-width="1" opacity=".7"/>

  <!-- 2: the model, a small lattice -->
  <g stroke-width="1" opacity=".55">
    <path d="M56 54h16M56 62h16M56 70h16M56 54v16M64 54v16M72 54v16M56 54l16 16M72 54l-16 16"/>
  </g>
  <g fill="var(--color-section)" stroke="none">
    <circle cx="56" cy="54" r="2.2"/><circle cx="64" cy="54" r="2.2"/><circle cx="72" cy="54" r="2.2"/>
    <circle cx="56" cy="62" r="2.2"/><circle cx="64" cy="62" r="2.2"/><circle cx="72" cy="62" r="2.2"/>
    <circle cx="56" cy="70" r="2.2"/><circle cx="64" cy="70" r="2.2"/><circle cx="72" cy="70" r="2.2"/>
  </g>

  <!-- 3: output -->
  <path d="M86 56h16M86 62h12M86 68h8"/>
  <rect x="96" y="65.5" width="6" height="5" fill="var(--color-section)" stroke="none"/>

  <!-- flow -->
  <path d="M45 62h6M49 59.5l2.5 2.5-2.5 2.5M77 62h5M79.5 59.5l2.5 2.5-2.5 2.5" stroke-width="1.2"/>

  <!-- numbered callouts, as in a service manual -->
  <g stroke-width="1" opacity=".7">
    <path d="M31 22v22M64 22v28M94 22v30"/>
  </g>
  <g fill="currentColor" stroke="none" style="font-family: var(--label); font-size: 7.5px" text-anchor="middle">
    <text x="31" y="18">1</text>
    <text x="64" y="18">2</text>
    <text x="94" y="18">3</text>
  </g>
</svg>
