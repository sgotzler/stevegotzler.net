<!doctype html><html data-theme="dark"><meta charset="utf-8"><link rel="stylesheet" href="../../src/styles/tokens.css">
<style>body{margin:0}section{background:var(--color-ground);color:var(--color-text);padding:36px 40px}

.m{border:1px solid var(--color-rule);padding:18px}svg{display:block;width:100%;height:auto}

  <rect x="82" y="56" width="28" height="34" rx="4"/>
  <path d="M17 68h14M17 73h14M17 78h9" stroke-width="1" opacity=".7"/>
  <circle cx="60" cy="73" r="6.5" stroke-width="1" opacity=".7"/>
  <path d="M60 70v6M57 73h6" stroke-width="1" opacity=".7"/>

  <!-- the worker, placed -->

  <path d="M72 18c16 2 24 14 24 32" stroke-width="1.2"/>
  <path d="M93 46.5l3 3.5 3-3.5" stroke-width="1.2"/>
  <path d="M104 52V30" stroke-width="1.2" stroke-dasharray="2 3"/>
  <path d="M101 33.5l3-3.5 3 3.5" stroke-width="1.2"/>
  <rect x="99" y="14" width="10" height="10" fill="var(--color-section)" stroke="none"/>
</svg>
</div><figcaption>A · Worker placement</figcaption></figure><figure><div class="m"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

  <rect x="8" y="26" width="104" height="62" rx="2" stroke-dasharray="2 4" opacity=".6"/>
  <g stroke-width="1" opacity=".35">
    <path d="M8 46.7h104M8 67.3h104M34 26v62M60 26v62M86 26v62"/>
  </g>

  <!-- 1: work -->
  <rect x="22" y="44" width="26" height="26" fill="var(--color-ground)"/>
  <!-- 2: play -->
  <circle cx="85" cy="57" r="13.5" fill="var(--color-ground)"/>
  <circle cx="85" cy="57" r="4" fill="var(--color-section)" stroke="none"/>
  <rect x="31" y="53" width="8" height="8" fill="var(--color-section)" stroke="none"/>

  <!-- each turns into the other -->
  <path d="M50 50c8-5 14-5 20-1" stroke-width="1.2"/>
  <path d="M66.5 46l3.7 3.2-4.6 1.6" stroke-width="1.2"/>

  <path d="M53.5 68l-3.7-3.2 4.6-1.6" stroke-width="1.2"/>

  <g stroke-width="1" opacity=".7"><path d="M35 18v24M85 18v23M106 18v6"/></g>
  <g fill="currentColor" stroke="none" style="font-family: var(--label); font-size: 7.5px" text-anchor="middle">

  </g>
</svg>
</div><figcaption>B · The lede as a diagram</figcaption></figure><figure><div class="m"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

  <rect x="52" y="20" width="54" height="40" rx="2"/>
  <rect x="57" y="25" width="44" height="30" rx="1" stroke-width="1" opacity=".7"/>
  <path d="M62 32h20M62 37h28M62 42h14" stroke-width="1" opacity=".7"/>
  <rect x="62" y="46" width="5" height="5" fill="currentColor" stroke="none"/>
  <path d="M72 60v8M62 68h34"/>
  <path d="M50 78h58l4 8H46z"/>
  <path d="M55 82h48" stroke-width="1" opacity=".7" stroke-dasharray="1 3"/>

  <!-- the worker piece, at the machine -->
  <path transform="translate(10 46) scale(2)" d="M10 0C7 0 5.5 2 5.5 4.5c0 1 .3 1.8.8 2.5C3 8 0 9.5 0 11.5c0 1.5 1.5 2 4.5 2L2 20h6l2-3.5 2 3.5h6l-2.5-6.5c3 0 4.5-.5 4.5-2 0-2-3-3.5-6.3-4.5.5-.7.8-1.5.8-2.5C14.5 2 13 0 10 0z" fill="var(--color-section)" stroke="none"/>

  <!-- the surface both stand on -->
  <path d="M4 90h112" stroke-width="1" opacity=".5"/>
</svg>
</div><figcaption>C · Meeple at a terminal</figcaption></figure></main></section>
