  <g fill="#141210" stroke="none"><circle cx="45.5" cy="25" r="1.3"/><circle cx="50.5" cy="25" r="1.3"/><circle cx="55.5" cy="25" r="1.3"/></g>
  <rect x="46" y="46" width="17" height="28" rx="3" stroke-width="1.3"/>
